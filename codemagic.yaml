workflows:
  android-debug:
    name: Android Debug APK
    max_build_duration: 60
    environment:
      flutter: stable
    cache:
      cache_paths:
        - $FLUTTER_ROOT/.pub-cache
        - $HOME/.gradle/caches
    scripts:
      - name: Get packages
        script: flutter pub get
      - name: Build APK
        script: flutter build apk --debug
    artifacts:
      - build/app/outputs/apk/debug/app-debug.apk
    publishing:
      email:
        recipients:
          - himanshu77.app@gmail.com
        notify:
          success: true
          failure: true

  ios-unsigned:
    name: iOS Unsigned IPA (for AltStore)
    max_build_duration: 60
    environment:
      flutter: stable
      xcode: 15.4
    scripts:
      - name: Get packages
        script: flutter pub get
      - name: Build iOS unsigned
        script: |
          flutter build ios --debug --no-codesign
          mkdir -p Payload
          cp -r build/ios/iphoneos/Runner.app Payload/Runner.app
          zip -r nearo-unsigned.ipa Payload
    artifacts:
      - nearo-unsigned.ipa
    publishing:
      email:
        recipients:
          - himanshu77.app@gmail.com
        notify:
          success: true
          failure: true
