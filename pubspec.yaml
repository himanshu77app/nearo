name: nearo
description: "Nearo — Find your people. Make it happen."
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"

# ─────────────────────────────────────────────────────────────
# DEPENDENCIES
# ─────────────────────────────────────────────────────────────
dependencies:
  flutter:
    sdk: flutter

  # ── State Management ──────────────────────────────────────
  flutter_riverpod: ^2.6.1
  riverpod_annotation: ^2.3.5

  # ── Navigation ────────────────────────────────────────────
  go_router: ^14.6.2

  # ── Network ───────────────────────────────────────────────
  dio: ^5.7.0

  # ── Supabase ──────────────────────────────────────────────
  supabase_flutter: ^2.8.4

  # ── Local Storage ─────────────────────────────────────────
  shared_preferences: ^2.3.3
  flutter_secure_storage: ^9.2.2

  # ── Environment ───────────────────────────────────────────
  flutter_dotenv: ^5.2.1

  # ── UI Utilities ──────────────────────────────────────────
  google_fonts: ^6.2.1
  cached_network_image: ^3.4.1
  shimmer: ^3.0.0

  # ── Utils ─────────────────────────────────────────────────
  intl: ^0.19.0
  equatable: ^2.0.7
  logger: ^2.4.0
  connectivity_plus: ^6.1.1
  permission_handler: ^11.3.1
  geolocator: ^13.0.2
  share_plus: ^10.1.2
  image_picker: ^1.1.2

  # ── Push Notifications ────────────────────────────────────
  firebase_core: ^3.10.1
  firebase_messaging: ^15.2.4
  flutter_local_notifications: ^17.2.4

  # ── App Info ──────────────────────────────────────────────
  package_info_plus: ^8.1.3

  cupertino_icons: ^1.0.8

# ─────────────────────────────────────────────────────────────
# DEV DEPENDENCIES
# ─────────────────────────────────────────────────────────────
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

  # Code generation
  build_runner: ^2.4.13
  riverpod_generator: ^2.4.3
  json_serializable: ^6.8.0
  json_annotation: ^4.9.0

  # Testing
  mocktail: ^1.0.4

# ─────────────────────────────────────────────────────────────
# FLUTTER CONFIG
# ─────────────────────────────────────────────────────────────
flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/
    - assets/animations/
    - env/

  # Fonts served via google_fonts package — no local ttf files needed
